<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block titulo %}Início{% endblock %} · Alerta Verde</title>
<link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
<script defer src="{{ url_for('static', filename='acoes.js') }}"></script></head>
<body><a class="salto" href="#conteudo">Ir para o conteúdo</a>
<header><div class="barra"><a class="marca" href="{{ url_for('inicio') }}"><i aria-hidden="true"></i>Alerta Verde</a>
<nav aria-label="Principal"><a href="{{ url_for('inicio') }}">Início</a><a href="{{ url_for('acompanhar') }}">Acompanhar denúncia</a>
<a href="{{ url_for('painel') }}">Área administrativa</a>
{% if session.get('guarda') %}<form method="post" action="{{ url_for('sair') }}"><input type="hidden" name="csrf" value="{{ session.csrf }}"><button class="link">Sair</button></form>{% endif %}</nav></div></header>
<main id="conteudo">{% for mensagem in get_flashed_messages() %}<p class="aviso" role="status">{{ mensagem }}</p>{% endfor %}
{% block corpo %}{% endblock %}</main><footer>Alerta Verde <span>Praças e parques</span></footer></body></html>
